/* ============================================================
   AETHER PROTOCOL — CORE VARIABLES & RESET
   ============================================================ */

  --violet: #6366F1;

  --violet-glow: rgba(99,102,241,0.15);
  --violet-border: rgba(99,102,241,0.3);
  --crimson: #EF4444;
  --crimson-glow: rgba(239,68,68,0.15);

  --amber-glow: rgba(245,158,11,0.15);
  --ice: #67E8F9;
  --ice-glow: rgba(103,232,249,0.1);
  --void-blue: #67E8F9;
  --inferno-red: #EF4444;
  --matrix-green: #10B981;
  --hero-color: #67E8F9;
  --hero-glow: rgba(103,232,249,0.4);
  --hero-dim: rgba(103,232,249,0.12);
  --text-prime: #E2E8F0;
  --text-sec: #94A3B8;
  --text-muted: #475569;
  --text-ghost: #1e293b;
  --glass-bg: rgba(10,10,15,0.7);
  --glass-border: rgba(255,255,255,0.04);

  --panel-border: 0.5px solid rgba(255,255,255,0.06);

  --dock-h: 72px;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --transition-slow: 0.5s cubic-bezier(0.4,0,0.2,1);
  --tier-common: rgba(148,163,184,0.18);

  --tier-legendary: rgba(239,68,68,0.18);
  --tier-text-common: #94A3B8;
  --tier-text-uncommon: #22C55E;
  --tier-text-rare: #3B82F6;
  --tier-text-epic: #A855F7;
  --tier-text-relic: #F59E0B;
  --tier-text-legendary: #EF4444;
  --rarity-common: #9e9e9e;
  --rarity-uncommon: #4caf50;
  --rarity-rare: #2196f3;
  --rarity-epic: #9c27b0;
  --rarity-relic: #f43f5e;
  --rarity-legendary: #ff9800;
  --rarity-common-glow: rgba(158,158,158,0.25);
  --rarity-uncommon-glow: rgba(76,175,80,0.25);
  --rarity-rare-glow: rgba(33,150,243,0.25);
  --rarity-epic-glow: rgba(156,39,176,0.3);
  --rarity-relic-glow: rgba(244,63,94,0.3);
  --rarity-legendary-glow: rgba(255,152,0,0.35);
}

/* ============================================================
   LIGHT THEME (Pearl / Pastel Green Glassmorphism)
   ============================================================ */
html[data-theme="light"], body[data-theme="light"] {
  --void:    #f1f5f3;
  --void-02: #e9efeb;
  --void-03: #dde6e1;
  --void-04: #d3ddd7;
  --void-05: #c8d4cd;
  --void-06: #bccac3;
  --text-prime: #1f2a26;
  --text-sec:   #4a5b54;
  --text-muted: #7c8c85;
  --text-ghost: #b9c4be;
  --glass-bg: rgba(255,255,255,0.55);
  --glass-border: rgba(20,40,30,0.08);
  --panel-border: 0.5px solid rgba(20,50,35,0.10);
  --emerald: #22a07a;
  --emerald-dim: #1a8262;
  --emerald-glow: rgba(34,160,122,0.18);
  --emerald-border: rgba(34,160,122,0.32);
  --violet: #7159d8;
  --violet-glow: rgba(113,89,216,0.16);
  --violet-border: rgba(113,89,216,0.30);
}
html[data-theme="light"] body { background: linear-gradient(135deg,#f3f8f5 0%,#e8efe9 50%,#e0ebde 100%); color: var(--text-prime); }

html[data-theme="light"] #bg-grid {
  background-image:
    linear-gradient(rgba(34,160,122,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,160,122,0.06) 1px, transparent 1px);
}
html[data-theme="light"] #bg-radial {
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(113,89,216,0.07) 0%, transparent 70%),
              radial-gradient(ellipse 50% 40% at 0% 100%, rgba(34,160,122,0.06) 0%, transparent 60%);
}

html[data-theme="light"] .home-right-panel,
html[data-theme="light"] .hrp-block,
html[data-theme="light"] .hero-showcase {
  background: rgba(255,255,255,0.66) !important;
  border: 1px solid rgba(20,60,40,0.10) !important;
  box-shadow: 0 6px 22px rgba(20,60,40,0.06), inset 0 0 0 1px rgba(255,255,255,0.5);
  backdrop-filter: blur(18px);

}

html[data-theme="light"] .modal-backdrop { background: rgba(220,235,228,0.55); }

}

/* ============================================================
   THEME TOGGLE BUTTON
   ============================================================ */
.theme-toggle {
  position: relative;
  width: 44px; height: 24px;
  border-radius: 14px;
  border: 1px solid var(--emerald-border);
  background: rgba(16,185,129,0.1);
  cursor: pointer;
  transition: all 0.25s ease;
  display: inline-flex; align-items: center;
  padding: 2px;
  margin-left: 4px;
}
.theme-toggle::before {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: linear-gradient(135deg,#67E8F9,#10B981);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 10px rgba(16,185,129,0.6);
}
html[data-theme="light"] .theme-toggle { background: rgba(255,255,255,0.7); border-color: rgba(34,160,122,0.4); }
html[data-theme="light"] .theme-toggle::before {
  transform: translateX(20px);
  background: linear-gradient(135deg,#fef3c7,#fcd34d);
  box-shadow: 0 0 10px rgba(252,211,77,0.6);
}
.theme-toggle .tt-icon {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 9px; opacity: 0.65;
}
.theme-toggle .tt-icon.tt-moon { left: 6px; }
.theme-toggle .tt-icon.tt-sun  { right: 6px; }

/* ============================================================
   QUICK ACTIONS PANEL (under resources)
   ============================================================ */
.quick-actions-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
  margin: 10px 0 14px;
  padding: 12px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 6px;
}
.qa-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px;
  padding: 12px 8px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(99,102,241,0.18);
  border-radius: 5px;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  font-family: var(--font-tact);
  color: var(--text-sec);
}
.qa-btn:hover {
  transform: translateY(-2px);
  border-color: var(--emerald);
  box-shadow: 0 6px 18px rgba(16,185,129,0.25), inset 0 0 0 1px rgba(16,185,129,0.15);
  color: var(--text-prime);
  background: rgba(16,185,129,0.06);
}
.qa-btn:active { transform: translateY(0) scale(0.97); }
.qa-icon {
  font-size: 22px; line-height: 1;
  filter: drop-shadow(0 0 6px var(--hero-glow));
}
.qa-label {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
}
html[data-theme="light"] .qa-btn { background: rgba(255,255,255,0.6); border-color: rgba(20,60,40,0.12); }
html[data-theme="light"] .qa-btn:hover { background: rgba(34,160,122,0.08); border-color: var(--emerald); }

/* ============================================================
   ACTIVITY TERMINAL (replaces system terminal)
   ============================================================ */
.activity-terminal {
  position: relative;
  border: 1px solid;
  border-image: linear-gradient(135deg, var(--emerald), var(--violet)) 1;
  background: linear-gradient(180deg, rgba(8,12,18,0.85), rgba(4,7,12,0.92));
  padding: 12px 14px;
  font-family: var(--font-tact);
  font-size: 11px;
  color: var(--text-prime);
  box-shadow: 0 0 28px rgba(16,185,129,0.10), inset 0 0 0 1px rgba(255,255,255,0.03);
  border-radius: 4px;
  min-height: 240px;
  max-height: 420px;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.activity-terminal::before {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px);
}
html[data-theme="light"] .activity-terminal {
  background: linear-gradient(180deg, rgba(245,250,247,0.9), rgba(232,241,235,0.92));
  color: var(--text-prime);
  box-shadow: 0 6px 22px rgba(34,160,122,0.10), inset 0 0 0 1px rgba(255,255,255,0.6);
}
.at-header {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px dashed rgba(16,185,129,0.25);
  font-size: 10px; letter-spacing: 0.18em; color: var(--emerald);
  text-transform: uppercase;
}
.at-header .at-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 8px var(--emerald);
  animation: at-pulse 1.4s ease-in-out infinite;
  display: inline-block; margin-right: 6px; vertical-align: middle;
}
@keyframes at-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }
.at-feed {
  flex: 1;
  overflow-y: auto;
  padding-right: 6px;
  scrollbar-width: thin;
}
.at-feed::-webkit-scrollbar { width: 3px; }
.at-feed::-webkit-scrollbar-thumb { background: var(--emerald-dim); border-radius: 2px; }
.at-line {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  animation: at-typein 0.4s ease both;
  line-height: 1.5;
}
@keyframes at-typein { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
.at-time { color: var(--text-muted); font-size: 9px; flex-shrink: 0; min-width: 38px; }
.at-tag  { font-size: 9px; padding: 1px 6px; border-radius: 2px; flex-shrink: 0; letter-spacing: 0.05em; text-transform: uppercase; }
.at-tag.task    { color: var(--emerald);  border: 1px solid var(--emerald-border);  background: rgba(16,185,129,0.06); }
.at-tag.success { color: #fbbf24;          border: 1px solid rgba(245,158,11,0.3);   background: rgba(245,158,11,0.06); }
.at-tag.loot    { color: #f59e0b;          border: 1px solid rgba(245,158,11,0.3);   background: rgba(245,158,11,0.06); }
.at-tag.system  { color: var(--text-sec);  border: 1px solid rgba(148,163,184,0.25); background: rgba(148,163,184,0.04); }
.at-tag.guild   { color: var(--violet);    border: 1px solid var(--violet-border);   background: rgba(99,102,241,0.06); }
.at-tag.raid    { color: var(--crimson);   border: 1px solid rgba(239,68,68,0.3);    background: rgba(239,68,68,0.06); }
.at-tag.profile { color: var(--ice);       border: 1px solid rgba(103,232,249,0.3);  background: rgba(103,232,249,0.06); }
.at-tag.info    { color: var(--text-sec);  border: 1px solid rgba(148,163,184,0.25); background: rgba(148,163,184,0.04); }
.at-msg { color: var(--text-prime); flex: 1; word-break: break-word; }
.at-empty { color: var(--text-muted); font-style: italic; padding: 16px; text-align: center; font-size: 11px; }
.at-cursor { display: inline-block; width: 8px; height: 12px; background: var(--emerald); animation: at-blink 1s step-end infinite; margin-left: 2px; vertical-align: middle; }
@keyframes at-blink { 50% { opacity: 0; } }

/* ============================================================
   SKELETON LOADERS
   ============================================================ */
.skeleton-block {
  position: relative; overflow: hidden;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 4px;
  height: 60px; margin-bottom: 8px;
}
.skeleton-block::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(16,185,129,0.10), transparent);
  animation: skel 1.4s linear infinite;
}
@keyframes skel { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.skeleton-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
html[data-theme="light"] .skeleton-block { background: rgba(20,40,30,0.05); border-color: rgba(20,40,30,0.08); }
html[data-theme="light"] .skeleton-block::after { background: linear-gradient(90deg, transparent, rgba(34,160,122,0.14), transparent); }

/* ============================================================
   ONBOARDING MODAL
   ============================================================ */
#onboarding-overlay {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(2,4,8,0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
  animation: ob-fade 0.3s ease;
}
#onboarding-overlay.active { display: flex; }
@keyframes ob-fade { from { opacity: 0; } to { opacity: 1; } }
.ob-shell {
  width: 100%; max-width: 720px;
  background: linear-gradient(180deg, rgba(10,14,20,0.95), rgba(4,7,12,0.98));
  border: 1px solid;
  border-image: linear-gradient(135deg, var(--emerald), var(--violet)) 1;
  border-radius: 6px;
  font-family: var(--font-tact);
  color: var(--text-prime);
  box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(16,185,129,0.12);
  overflow: hidden;
  animation: ob-pop 0.4s cubic-bezier(0.4,0,0.2,1);
}
@keyframes ob-pop { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
html[data-theme="light"] .ob-shell {
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(240,247,242,0.98));
  color: var(--text-prime);
}
.ob-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(16,185,129,0.2);
  background: rgba(0,0,0,0.3);
}
html[data-theme="light"] .ob-header { background: rgba(34,160,122,0.06); border-bottom-color: rgba(34,160,122,0.2); }
.ob-brand { display: flex; align-items: center; gap: 10px; }
.ob-diamond { width: 14px; height: 14px; background: var(--emerald); transform: rotate(45deg); box-shadow: 0 0 10px var(--emerald-glow); }
.ob-title-mini { font-size: 11px; letter-spacing: 0.25em; color: var(--emerald); text-transform: uppercase; }
.ob-sub-mini { font-size: 9px; letter-spacing: 0.15em; color: var(--text-muted); margin-top: 2px; }
.ob-close-btn {
  background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted);
  font-family: var(--font-tact); font-size: 11px; cursor: pointer; padding: 4px 12px; border-radius: 2px;
  transition: all 0.15s;
}
.ob-close-btn:hover { color: var(--crimson); border-color: var(--crimson); }
.ob-progress { display: flex; align-items: center; gap: 6px; padding: 16px 22px 0; }
.ob-step-node {
  width: 26px; height: 26px;
  border: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-muted);
  font-family: var(--font-tact);
  transition: all 0.25s;
  border-radius: 2px;
}
.ob-step-node.done { border-color: var(--emerald-dim); color: var(--emerald-dim); background: rgba(16,185,129,0.06); }
.ob-step-node.active { border-color: var(--emerald); color: var(--emerald); background: rgba(16,185,129,0.12); box-shadow: 0 0 12px rgba(16,185,129,0.3); }
.ob-step-sep { flex: 1; height: 1px; background: rgba(255,255,255,0.08); max-width: 40px; transition: background 0.3s; }
.ob-step-sep.done { background: var(--emerald-dim); }
.ob-body { padding: 22px 24px 18px; min-height: 320px; }
.ob-slide { display: none; animation: ob-fadein 0.35s ease; }
.ob-slide.active { display: block; }
@keyframes ob-fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ob-section-label {
  color: var(--emerald);
  font-size: 10px; letter-spacing: 0.3em;
  margin-bottom: 14px; text-transform: uppercase;
  border-bottom: 1px solid rgba(16,185,129,0.18);
  padding-bottom: 8px;
}
.ob-big-title { font-family: var(--font-intel); font-size: 22px; font-weight: 800; color: var(--text-prime); line-height: 1.2; margin-bottom: 10px; }
.ob-hl-g { color: var(--emerald); }
.ob-hl-p { color: var(--violet); }
.ob-hl-o { color: var(--amber); }
.ob-hl-r { color: var(--crimson); }
.ob-desc { color: var(--text-sec); font-size: 12px; line-height: 1.85; margin-bottom: 18px; }
.ob-pillars { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.ob-pillar { border: 1px solid; padding: 14px; background: rgba(0,0,0,0.4); border-radius: 3px; }
html[data-theme="light"] .ob-pillar { background: rgba(255,255,255,0.5); }
.ob-pillar.g { border-color: var(--emerald-border); }
.ob-pillar.p { border-color: var(--violet-border); }
.ob-pillar.o { border-color: rgba(245,158,11,0.32); }
.ob-pillar-head { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
.ob-pillar-body { font-size: 11px; color: var(--text-sec); line-height: 1.65; }
.ob-footer { padding: 14px 22px; display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid rgba(16,185,129,0.15); background: rgba(0,0,0,0.25); flex-wrap: wrap; }
html[data-theme="light"] .ob-footer { background: rgba(34,160,122,0.05); border-top-color: rgba(34,160,122,0.2); }
.ob-btn {
  padding: 9px 22px; font-family: var(--font-tact); font-size: 11px;
  letter-spacing: 0.15em; cursor: pointer; border-radius: 2px;
  text-transform: uppercase; transition: all 0.15s;
  background: transparent; border: 1px solid;
}
.ob-btn-primary { border-color: var(--emerald); color: var(--emerald); }
.ob-btn-primary:hover { background: var(--emerald); color: #000; box-shadow: 0 0 14px var(--emerald-glow); }
.ob-btn-ghost { border-color: var(--text-muted); color: var(--text-muted); }
.ob-btn-ghost:hover { border-color: var(--text-prime); color: var(--text-prime); }
.ob-terminal-log { font-family: var(--font-tact); font-size: 12px; color: var(--emerald); line-height: 2.1; margin-bottom: 16px; }
.ob-log-line { opacity: 0; animation: ob-logline 0.4s ease forwards; }
.ob-log-line:nth-child(1) { animation-delay: 0.1s; }
.ob-log-line:nth-child(2) { animation-delay: 0.7s; }
.ob-log-line:nth-child(3) { animation-delay: 1.3s; }
.ob-log-line:nth-child(4) { animation-delay: 1.9s; color: #fbbf24; }
@keyframes ob-logline { to { opacity: 1; } }
.ob-blink { animation: ob-blink 1s step-end infinite; }
@keyframes ob-blink { 50% { opacity: 0; } }

/* ============================================================
   BATTLE COMBO + DAMAGE NUMBERS + SCREEN SHAKE
   ============================================================ */
.combo-counter {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-tact); font-size: 13px; letter-spacing: 0.2em;
  padding: 6px 16px; border-radius: 22px;
  background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.5);
  color: #fbbf24;
  box-shadow: 0 0 16px rgba(245,158,11,0.4);
  z-index: 60;
  display: none;
  animation: combo-pulse 0.5s ease;
}
.combo-counter.active { display: block; }
@keyframes combo-pulse { 0% { transform: translateX(-50%) scale(1.5); } 100% { transform: translateX(-50%) scale(1); } }
.battle-progress-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: rgba(255,255,255,0.06);
  z-index: 50;
}
.battle-progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--emerald), var(--amber), var(--crimson));
  transition: width 0.5s linear;
  width: 0%;
}
.dmg-popup {
  position: absolute;
  font-family: var(--font-tact);
  font-weight: 800;
  font-size: 22px;
  color: #fbbf24;
  text-shadow: 0 0 8px rgba(245,158,11,0.7), 0 2px 4px rgba(0,0,0,0.8);
  pointer-events: none;
  animation: dmg-float 1.0s cubic-bezier(0.2,0.8,0.4,1) forwards;
  z-index: 100;
}
.dmg-popup.crit { font-size: 30px; color: var(--crimson); text-shadow: 0 0 12px rgba(239,68,68,0.9), 0 2px 6px rgba(0,0,0,0.9); }
.dmg-popup.heal { color: #34d399; text-shadow: 0 0 8px rgba(52,211,153,0.7); }
.dmg-popup.block { color: #67e8f9; font-size: 16px; }
@keyframes dmg-float { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); } 25% { opacity: 1; transform: translate(-50%, -16px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -50[...]
.battle-shake { animation: battle-shake 0.34s cubic-bezier(0.36,0.07,0.19,0.97); }
@keyframes battle-shake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}
.counter-window {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 110px; height: 110px;
  border-radius: 50%;
  border: 3px solid var(--ice);
  pointer-events: none;
  animation: counter-shrink 0.9s ease forwards;
  z-index: 90;
  box-shadow: 0 0 30px var(--ice-glow), inset 0 0 18px var(--ice-glow);
}
@keyframes counter-shrink { 0% { transform: translate(-50%,-50%) scale(2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(0.4); opacity: 0; } }
.tactical-bar {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.4); border: 1px solid rgba(99,102,241,0.18); border-radius: 4px;
}
html[data-theme="light"] .tactical-bar { background: rgba(255,255,255,0.55); border-color: rgba(20,60,40,0.12); }
.tact-btn {
  flex: 1; min-width: 100px; padding: 10px 12px;
  font-family: var(--font-tact); font-size: 11px; letter-spacing: 0.1em;
  background: transparent; border: 1px solid; cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s; text-align: center;
  text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.tact-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.tact-btn .tact-ic { font-size: 18px; line-height: 1; }
.tact-attack  { border-color: var(--crimson); color: var(--crimson); }
.tact-attack:hover:not(:disabled)  { background: var(--crimson); color: #fff; box-shadow: 0 0 14px rgba(239,68,68,0.4); }
.tact-defend  { border-color: var(--ice); color: var(--ice); }
.tact-defend:hover:not(:disabled)  { background: var(--ice); color: #000; box-shadow: 0 0 14px var(--ice-glow); }
.tact-counter { border-color: var(--violet); color: var(--violet); }
.tact-counter:hover:not(:disabled) { background: var(--violet); color: #fff; box-shadow: 0 0 14px var(--violet-glow); }
.tact-rest    { border-color: var(--amber); color: var(--amber); }
.tact-rest:hover:not(:disabled)    { background: var(--amber); color: #000; box-shadow: 0 0 14px var(--amber-glow); }

/* Hide quick siphon block (legacy) and Live Telemetry terminal */
.hrp-quick-siphon { display: none !important; }
.au-live-term { display: none !important; }

/* === HOME SCREEN — improved symmetry & glass borders ============ */
.home-screen-grid {
  grid-template-columns: minmax(360px, 0.85fr) 1.15fr !important;
  gap: 22px !important;
  align-items: stretch;
}
.home-screen-grid > .hero-showcase,
.home-screen-grid > .home-right-panel {
  border: 1px solid rgba(34, 160, 122, 0.18);
  border-radius: 6px;
  padding: 18px;
  background:
    linear-gradient(140deg, rgba(20, 30, 40, 0.55), rgba(8, 12, 18, 0.65)),
    radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 60%);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  position: relative;
  overflow: hidden;
}
.home-screen-grid > .hero-showcase::before,
.home-screen-grid > .home-right-panel::before {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  background: linear-gradient(120deg, transparent 40%, rgba(34,160,122,0.05) 50%, transparent 60%);
  background-size: 220% 100%;
  animation: home-shimmer 9s linear infinite;
}
@keyframes home-shimmer { 0% { background-position: 220% 0;} 100% {background-position: -120% 0;} }
.home-right-panel { padding: 0 !important; }
.home-right-panel .hrp-block {
  border: 1px solid rgba(34, 160, 122, 0.16);
  border-radius: 5px;
  background: rgba(8, 12, 20, 0.55);
}
html[data-theme="light"] .home-screen-grid > .hero-showcase,
html[data-theme="light"] .home-screen-grid > .home-right-panel {
  border-color: rgba(34, 160, 122, 0.25);
  background: linear-gradient(140deg, rgba(255,255,255,0.85), rgba(240,250,245,0.75));
}

/* === DAILY REWARDS CALENDAR ====================================== */
.hrp-daily-cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.dr-day {
  border: 1px solid rgba(34,160,122,0.18);
  border-radius: 4px;
  padding: 8px 4px;
  text-align: center;
  font-family: var(--font-tact);
  font-size: 9px;
  color: var(--text-sec);
  background: rgba(8, 14, 20, 0.6);
  position: relative;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
}
.dr-day .dr-num { font-size: 12px; color: var(--text-pri); margin-bottom: 4px; font-weight: 600; }
.dr-day .dr-rew { font-size: 14px; line-height: 1; }
.dr-day .dr-amt { font-size: 9px; color: var(--text-muted); margin-top: 4px; }
.dr-day.dr-claimed {
  border-color: rgba(34,160,122,0.55);
  background: rgba(34,160,122,0.1);
  color: var(--emerald);
}
.dr-day.dr-claimed::after {
  content: '✓';
  position: absolute; top: 2px; right: 4px;
  color: var(--emerald);
  font-size: 9px;
}
.dr-day.dr-today {
  border-color: var(--amber);
  background: rgba(245,158,11,0.12);
  box-shadow: 0 0 14px rgba(245,158,11,0.3);
  animation: dr-pulse 1.6s ease-in-out infinite;
}
.dr-day.dr-today .dr-num, .dr-day.dr-today .dr-amt { color: var(--amber); }
.dr-day.dr-locked { opacity: 0.45; }
.dr-day.dr-mega { background: linear-gradient(140deg, rgba(168,85,247,0.18), rgba(34,160,122,0.18)); border-color: rgba(168,85,247,0.5); }
@keyframes dr-pulse { 0%,100%{ transform: scale(1);} 50% { transform: scale(1.06);} }

/* === ARENA — bigger battle progress + tighter HUD ================ */
.arena-battle .arena-hud {
  border: 1px solid rgba(34,160,122,0.18);
  border-radius: 4px;
  padding: 8px 12px;
  background: rgba(8,12,20,0.55);
}
.battle-time-label {
  font-family: var(--font-tact);
  font-size: 11px;
  color: var(--amber);
  text-align: center;
  margin-top: 4px;
  letter-spacing: 0.08em;
}

/* === DAILY STREAK METER (AAAA polish) ============================ */
.dr-streak-meter {
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(168,85,247,0.25);
  border-radius: 4px;
  background: linear-gradient(120deg, rgba(168,85,247,0.08), rgba(34,160,122,0.06));
  font-family: var(--font-tact);
}
.dr-streak-meter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 10px; }
.dr-streak-meter-label { color: var(--text-sec); letter-spacing: 0.05em; }
.dr-streak-meter-value { color: var(--violet); font-size: 12px; font-weight: 700; }
.dr-streak-bar {
  height: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.dr-streak-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--emerald), var(--violet), var(--amber));
  background-size: 200% 100%;
  animation: streak-shine 3s linear infinite;
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
  box-shadow: 0 0 12px rgba(168,85,247,0.4);
}
@keyframes streak-shine { 0% { background-position: 0 0;} 100% {background-position: 200% 0;} }
.dr-mega-ready {
  margin-top: 6px;
  text-align: center;
  font-size: 10px;
  color: var(--amber);
  letter-spacing: 0.08em;
  animation: dr-pulse 1.4s ease-in-out infinite;
}

/* === ARENA AAAA — status icons, ULT meter, crit flash ============= */
.battle-status-icons {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin-top: 4px;
  min-height: 18px;
}
.status-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px;
  border-radius: 3px;
  font-size: 10px;
  border: 1px solid currentColor;
  position: relative;
}
.status-icon.burn { color: #ef4444; background: rgba(239,68,68,0.12); }
.status-icon.poison { color: #84cc16; background: rgba(132,204,22,0.12); }
.status-icon.stun { color: #f59e0b; background: rgba(245,158,11,0.12); animation: dr-pulse 0.8s infinite; }
.status-icon.shield { color: #22d3ee; background: rgba(34,211,238,0.15); }
.status-icon.boost { color: #a855f7; background: rgba(168,85,247,0.15); }
.status-icon .stack { position: absolute; bottom: -2px; right: -2px; font-size: 7px; background: #000; color: #fff; padding: 0 2px; border-radius: 2px; }

.ult-meter {
  margin-top: 6px;
  height: 8px;
  border: 1px solid rgba(168,85,247,0.4);
  border-radius: 2px;
  background: rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}
.ult-meter-fill {
  height: 100%;
  background: linear-gradient(90deg, #a855f7, #f59e0b);
  background-size: 200% 100%;
  animation: streak-shine 2s linear infinite;
  transition: width 0.4s ease-out;
}
.ult-meter-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-tact); font-size: 8px; color: #fff;
  text-shadow: 0 0 4px #000;
  letter-spacing: 0.1em;
}
.ult-meter.ready { box-shadow: 0 0 14px rgba(245,158,11,0.6); animation: dr-pulse 1.2s infinite; }

@keyframes crit-flash {
  0% { background: transparent; }
  20% { background: rgba(239,68,68,0.18); }
  100% { background: transparent; }
}
.arena-battle.crit-flash::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  animation: crit-flash 0.45s ease-out;
  border-radius: 4px;
}

/* === HERO SHOWCASE — extra glass refinements ====================== */
.home-screen-grid > .hero-showcase {
  display: flex; flex-direction: column; gap: 14px;
}
.home-screen-grid > .home-right-panel { padding: 14px !important; }
.home-right-panel .hrp-block {
  padding: 12px 14px;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
}
.home-right-panel .hrp-block:hover {
  border-color: rgba(34,160,122,0.35);
  box-shadow: 0 0 18px rgba(34,160,122,0.12);
  transform: translateY(-1px);
}
.hrp-daily-rewards { background: linear-gradient(140deg, rgba(168,85,247,0.06), rgba(34,160,122,0.04)) !important; }

/* ================================================================
   RIGHT PANEL — V2 RECRAFTED (sharper, cleaner, hierarchical)
   ================================================================ */
.home-right-panel {
  display: flex !important;
  flex-direction: column;
  gap: 12px !important;
  padding: 14px !important;
  max-height: calc(100vh - 180px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(34,160,122,0.4) transparent;
}
.home-right-panel::-webkit-scrollbar { width: 4px; }
.home-right-panel::-webkit-scrollbar-thumb { background: rgba(34,160,122,0.4); border-radius: 2px; }

/* === OPERATOR CARD (top) === */
.op-card {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 14px;
  padding: 14px 16px !important;
  background: linear-gradient(135deg, rgba(34,160,122,0.10), rgba(99,102,241,0.06)) !important;
  border: 1px solid rgba(34,160,122,0.30) !important;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.op-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--emerald), var(--violet), var(--amber), transparent);
  background-size: 200% 100%;
  animation: streak-shine 4s linear infinite;
}
.op-rank-badge {
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  border: 1.5px solid var(--emerald);
  border-radius: 8px;
  background: radial-gradient(circle at center, rgba(34,160,122,0.20), rgba(8,12,18,0.6));
  padding: 8px 4px;
  box-shadow: 0 0 18px rgba(34,160,122,0.25), inset 0 0 12px rgba(34,160,122,0.1);
}
.op-rank-letter {
  font-family: var(--font-display, 'JetBrains Mono'), monospace;
  font-size: 28px; font-weight: 800;
  color: var(--emerald);
  line-height: 1;
  text-shadow: 0 0 12px var(--emerald-glow, rgba(34,160,122,0.6));
}
.op-rank-label {
  font-family: var(--font-tact); font-size: 8px;
  color: var(--text-muted); letter-spacing: 0.12em; margin-top: 4px;
}
.op-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.op-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.op-name {
  font-family: var(--font-tact); font-size: 13px; font-weight: 700;
  color: var(--text-pri); letter-spacing: 0.04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.op-level {
  font-family: var(--font-tact); font-size: 11px;
  color: var(--violet);
  background: rgba(168,85,247,0.12);
  padding: 2px 8px; border-radius: 3px;
  border: 1px solid rgba(168,85,247,0.3);
  white-space: nowrap;
}
.op-class {
  font-family: var(--font-tact); font-size: 9.5px;
  color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;
}
.op-xp-row { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: var(--text-muted); margin-top: 4px; }
.op-xp-bar { height: 5px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.op-xp-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--violet)); border-radius: 3px; transition: width 0.6s; box-shadow: 0 0 8px rgba(34,160,122,0.4); }
.op-streak {
  display: flex; align-items: center; gap: 6px;
  margin-top: 4px;
  font-family: var(--font-tact); font-size: 10px;
  color: var(--amber);
}
.op-streak .flame { font-size: 13px; }
.op-streak .num { font-weight: 700; color: var(--amber); }
.op-streak .legend { color: #ef4444; margin-left: 6px; padding: 1px 6px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); border-radius: 3px; font-size: 8.5px; }

/* === BLOCK HEADERS (V2) === */
.hrp-v2-block {
  background: rgba(8, 12, 20, 0.55) !important;
  border: 1px solid rgba(34, 160, 122, 0.18) !important;
  border-radius: 5px;
  padding: 11px 13px !important;
  position: relative;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
.hrp-v2-block:hover {
  border-color: rgba(34, 160, 122, 0.40) !important;
  box-shadow: 0 0 14px rgba(34, 160, 122, 0.10);
  transform: translateY(-1px);
}
.hrp-v2-head {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-tact); font-size: 9.5px;
  letter-spacing: 0.10em;
  color: var(--text-sec);
  margin-bottom: 9px;
  padding-bottom: 6px;
  border-bottom: 1px dashed rgba(34, 160, 122, 0.18);
}
.hrp-v2-head .h-label { display: flex; align-items: center; gap: 6px; }
.hrp-v2-head .h-icon { color: var(--emerald); font-size: 12px; }
.hrp-v2-head .h-aux { color: var(--text-muted); font-size: 9px; }

/* === DAILY PROGRESS V2 === */
.dp-grid { display: flex; flex-direction: column; gap: 8px; }
.dp-row {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 9px;
  align-items: center;
  padding: 6px 0;
}
.dp-icon {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  font-size: 12px;
  border-radius: 4px;
  background: rgba(34,160,122,0.10);
  color: var(--emerald);
  border: 1px solid rgba(34,160,122,0.20);
}
.dp-row.violet .dp-icon { background: rgba(168,85,247,0.10); color: var(--violet); border-color: rgba(168,85,247,0.20); }
.dp-row.crimson .dp-icon { background: rgba(239,68,68,0.10); color: #ef4444; border-color: rgba(239,68,68,0.25); }
.dp-info { min-width: 0; }
.dp-label { font-family: var(--font-tact); font-size: 9.5px; color: var(--text-sec); letter-spacing: 0.05em; }
.dp-bar-wrap { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.dp-bar-fill { height: 100%; background: var(--emerald); border-radius: 2px; transition: width 0.6s; box-shadow: 0 0 6px rgba(34,160,122,0.4); }
.dp-row.violet .dp-bar-fill { background: var(--violet); box-shadow: 0 0 6px rgba(168,85,247,0.4); }
.dp-row.crimson .dp-bar-fill { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.4); }
.dp-val {
  font-family: var(--font-tact); font-size: 10px;
  color: var(--text-pri); white-space: nowrap;
  background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 3px;
}
.dp-row.done .dp-val { color: var(--emerald); }
.dp-row.done .dp-val::after { content: ' ✓'; color: var(--emerald); }

/* === MISSIONS V2 === */
.miss-list { display: flex; flex-direction: column; gap: 5px; }
.miss-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 8px; align-items: center;
  padding: 7px 9px;
  background: rgba(0,0,0,0.25);
  border-left: 2px solid var(--text-muted);
  border-radius: 3px;
  font-family: var(--font-tact);
  transition: transform 0.15s, background 0.15s;
}
.miss-row:hover { background: rgba(34,160,122,0.06); transform: translateX(2px); }
.miss-row.r-s { border-left-color: var(--amber); }
.miss-row.r-a { border-left-color: var(--violet); }
.miss-row.r-b { border-left-color: var(--emerald); }
.miss-row.r-c { border-left-color: #22d3ee; }
.miss-row.r-d { border-left-color: var(--text-muted); }
.miss-rank {
  font-size: 9px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.05);

}
.miss-row.r-s .miss-rank { color: var(--amber); }
.miss-row.r-a .miss-rank { color: var(--violet); }

.miss-row.r-c .miss-rank { color: #22d3ee; }

}

  font-size: 11px; cursor: pointer;

  border: 1px solid rgba(34,160,122,0.35);

.miss-empty {
  text-align: center; padding: 14px 8px;
